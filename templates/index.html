<script>


const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

try{user=localStorage.getItem("lw_user")||"";rewards=localStorage.getItem("lw_rewards")!=="0"}catch(e){}

 if(window.__story){window.__story.unmount();window.__story=null}
 if(!NICK.test(user)&&view!=="dash")view="dash";

 const tabs=[["dash","Dashboard"],["learn","Learn & Practice"],["resources","Resources"],["assess","Assessments"],["plan","My Study Plan"],["progress","My Progress"]],cur=({module:"learn",quiz:"assess",results:"assess"})[view]||view;
 $("nav").innerHTML=tabs.map(t=>`<button ${cur===t[0]?'class="on" aria-current="page"':""} onclick="go('${t[0]}')">${ico(t[0])}<span>${t[1]}</span></button>`).join("");

 const pills=rewards?`<span class="pill">${ico("star")} ${tip("Level "+d.level,"Every 100 XP is one level.","r")}</span><span class="pill"><b data-count="${d.xp}">${d.xp}</b> ${tip("XP","Experience points, earned once for each finished quiz, study task, first-try practice item and module.","r")}</span><span class="pill">${tip("Day streak","Days in a row with a learning activity. Missing a day never costs you anything.","r")} <b data-count="${d.streak}">${d.streak}</b></span>`:"";
 const maxc=Math.max(1,...d.activity.map(a=>a.count)),week=d.activity.reduce((s,a)=>s+a.count,0);
 const bars=d.activity.map(a=>`<div class="wb ${a.count?"":"z"}" title="${esc(a.d)}: ${a.count} learning activities"><span>${a.count||""}</span><i style="--bh:${Math.max(4,Math.round(a.count/maxc*56))}px"></i><small>${esc(a.label)}</small></div>`).join("");
 const nodes=d.topics.map(t=>{const md=d.modules.find(x=>x.topic===t.k);return`<button class="node ${SC[t.status]}" onclick="openModule('${t.k}')" aria-label="${esc(t.name)}: ${t.status}${md?`, ${md.solved} of ${md.total} practice items solved`:""}"><span class="c">${ST[t.status][0]}</span><span>${esc(t.name.split(" ")[0])}</span></button>`}).join("");
 const s1=`<div class="panel"><div class="dtop"><div><h1>${guest?"Welcome to LearnWise AI":(l?"Welcome back":"Welcome")+", "+esc(hello)+"!"}</h1><div class="muted">${l?"Ready to level up your Python skills?":"Your Python journey starts here. Take the diagnostic quiz and we will build your first study plan."}</div></div><div class="pills">${pills}</div></div>
 <div class="dgrid"><div class="tile"><h3>Your progress</h3><div class="rings">${ring(comp,"Course completion",`${done} of ${d.modules.length} modules`)}${ring(l?l.s:0,"Latest quiz score",l?`${l.correct} of ${l.total} correct`:"No quiz yet")}</div><div class="two"><div><b data-count="${strong}">${l?strong:"—"}</b><span class="muted">${tip("topics strong","Strong means 80% or more on your latest quiz. It is a rule, not proof of mastery.")}</span></div><div><b data-count="${prac}">${l?prac:"—"}</b><span class="muted">need practice</span></div></div>${l&&l.demo?'<p class="muted">Quiz data shown is demo data.</p>':""}</div>
 <div class="col"><div class="tile"><h3>Weekly activity: ${week} learning ${week===1?"activity":"activities"} in the last 7 days</h3><div class="wbars">${bars}</div></div><div class="tile"><h3>Python learning path</h3><div class="path">${nodes}</div></div></div>
 <div class="tile"><h3>Next lesson</h3><b>${esc(nx.title)}</b><p class="muted">${esc(nx.why)}</p>${nx.kind==="task"?`<div class="meta"><span>${nx.minutes} min</span><span>Difficulty: ${esc(nx.difficulty)}</span></div>`:""}${l?`<p class="muted"><b>Study goal:</b> reach ${TH.strong}% in every topic. This week: ${Math.min(d.weekly.count,d.weekly.goal)} of ${d.weekly.goal} activities.</p>`:`<p class="muted"><b>First goal:</b> ${esc(d.starter.goal)}</p>`}<button id="continueBtn" class="pri cta" onclick="${act}">${label}</button>${!l?`<button class="ghost cta" onclick="openModule('${d.starter.topic}')">Try a starter lesson: ${esc(TOP[d.starter.topic])}</button>`:""}</div></div></div>`;
 const days=pend.slice(0,3);
 const s2=`<div class="panel"><h2>${ico("plan")} Your personal learning journey</h2><div class="jgrid"><div class="tile"><h3>Study plan timeline</h3>${d.tasks.length?`<div class="tl">${d.tasks.map(t=>`<div class="ti ${t.completed?"done":""}"><b>Day ${t.day}: ${esc(t.title)}</b><div class="muted">${t.minutes} min, ${t.completed?"completed":"to do"}</div></div>`).join("")}</div>`:`<p class="muted">Your plan appears after your first assessment.</p><button class="pri" onclick="begin()">Take the diagnostic quiz</button>`}</div>
 <div class="col"><div class="tile"><h3>Recommended next steps</h3>${days.length?days.map(t=>`<div class="row" style="margin:6px 0"><span>${esc(t.title)}<br><span class="muted">${t.minutes} min</span></span><button class="ghost sm" onclick="${t.topic?`openModule('${t.topic}')`:"begin()"}">Open</button></div>`).join(""):`<p class="muted">${d.tasks.length?"All plan tasks are done. Retake the quiz to measure your progress.":"Steps appear once you have quiz results."}</p>`}</div>
 <div class="tile"><h3>So far</h3><p>Assessments taken: <b>${d.attempts}</b><br>Study tasks done: <b>${d.tasks_done} of ${d.tasks_total}</b><br>Modules completed: <b>${done} of ${d.modules.length}</b></p></div></div></div></div>`;
 const s3=`<div class="panel"><h2>${ico("progress")} Skills and topic mastery</h2><p class="muted">Estimates from your latest assessment, a few questions per topic, not proof of mastery.</p><div class="skills">${d.topics.map(t=>{const s=ST[t.status],md=d.modules.find(x=>x.topic===t.k)||{solved:0,total:2};return`<div class="sk"><b>${esc(t.name)}</b><span class="chip ${s[1]}">${s[0]} ${t.status}</span><div class="bar"><i class="${s[1]||"none"}" style="width:${t.pct||0}%"></i></div><div class="muted">${t.n?`${t.correct} of ${t.n} correct`:"Not assessed yet"}<br>Module: ${md.solved} of ${md.total} practice items</div></div>`}).join("")}</div></div>`;
 const it=m.items.find(x=>!x.solved)||m.items[0];
 const s4=`<div class="panel"><h2>${ico("learn")} Practice Python: ${esc(m.title)}</h2><div class="cgrid"><div class="tile"><h3>Example</h3><pre class="code"><code>${hl(m.code)}</code></pre><p class="muted">The comments show what each line prints. ${esc(m.takeaway)}</p><button class="ghost sm" onclick="openModule('${m.topic}')">Open the full module</button></div>
 <div class="tile"><h3>Challenge: ${it.kind==="bug"?"Find the bug":"Predict the output"} <span class="chip ${it.solved?"good":""}" id="st_${it.id}">${it.solved?"Solved":"Not solved yet"}</span></h3><p>${esc(it.prompt)}</p>${it.code?`<pre class="code"><code>${hl(it.code)}</code></pre>`:""}<div role="group" aria-label="Answer options">${it.options.map((o,k)=>`<button class="opt" onclick="answerItem('${it.id}',${k})">${String.fromCharCode(65+k)}. ${esc(o)}</button>`).join("")}</div><div id="fb_${it.id}" role="status"></div></div></div></div>`;
 const rw=rewards?`<div class="row"><b>Level ${d.level}</b><span class="muted">${d.xp} XP</span></div><div class="bar"><i class="good" style="width:${d.into}%"></i></div><p class="muted">${d.per_level-d.into} XP to level ${d.level+1}. XP is earned once for each finished quiz, study task, first-try practice item and module.</p><p>Current streak: <b>${d.streak}</b> day${d.streak===1?"":"s"}. Active days: ${d.active_days}. Missing a day never costs you anything.</p><p>This week: ${Math.min(d.weekly.count,d.weekly.goal)} of ${d.weekly.goal} activities</p><div class="bar"><i style="width:${Math.min(100,d.weekly.count/d.weekly.goal*100)}%"></i></div>${d.best!=null?`<p>Personal best (real assessments): <b>${d.best}%</b></p>`:""}${d.badges.map(b=>`<div class="bdg ${b.earned?"on":""}"><b>${b.earned?"Earned":"Locked"}: ${esc(b.name)}</b><div class="muted">${esc(b.desc)}</div></div>`).join("")}`:`<p class="muted">Rewards are hidden.</p><button class="ghost" onclick="toggleRewards(true)">Show rewards</button>`;
 const s5=`<div class="panel"><h2>${ico("star")} Achievements and motivation</h2><div class="agrid"><div class="tile"><h3>Rewards</h3>${rw}</div><div class="tile"><h3>Recent activity</h3>${d.timeline.length?d.timeline.slice(0,6).map(x=>`<div class="task"><div><b>${esc(x.text)}</b><div class="muted">${esc(x.t.slice(0,16).replace("T"," "))}</div></div></div>`).join(""):'<p class="muted">No activity yet. Your real activity will appear here.</p>'}</div></div></div>`;
 const s6=`<div class="panel final"><h2>Your next breakthrough starts here</h2><p class="muted">${esc(nx.why)}</p><div class="row"><button class="pri" onclick="${act}">${label}</button><button class="ghost" onclick="go('learn')">Practice Python</button>${nx.kind==="quiz"?"":'<button class="ghost" onclick="begin()">Take Diagnostic Quiz</button>'}${!l?'<button class="ghost" onclick="demo()">Load demo history (sample data)</button>':""}</div><label class="opt-toggle"><input type="checkbox" ${rewards?"checked":""} onchange="toggleRewards(this.checked)"> Show rewards (XP, level, badges)</label></div>`;
 const names=["Dashboard","Your journey","Skills","Practice","Achievements","Next step"];
 $("app").innerHTML=`<div class="story" id="story"><div class="stage">${[s1,s2,s3,s4,s5,s6].map((h,i)=>`<section class="scene s${i+1}" aria-label="${names[i]}">${h}</section>`).join("")}</div><div class="dots" role="group" aria-label="Jump to a scene">${names.map(n=>`<button aria-label="Go to ${n}" title="${n}"></button>`).join("")}</div></div>`;
 window.__story=window.Story?Story.mount($("story")):null}
async function learn(){if(!NICK.test(user))return needName();
 const m=(await api(mine("/api/modules"))).modules;
 $("app").innerHTML=`<div class="card"><h2>${ico("learn")} Learn Python step by step</h2><p class="muted">Each module has a short explanation, an example, and two practice activities with instant feedback.</p></div><div class="grid">${m.map(x=>`<div class="card"><div class="row"><h3>${esc(x.title)}</h3><span class="chip ${x.status==="Completed"?"good":""}">${x.status}</span></div>${x.recommended?'<span class="tag">Recommended for you</span>':""}<p class="muted">${x.solved} of ${x.total} practice items solved</p><button class="${x.recommended?"pri":"ghost"}" onclick="openModule('${x.topic}')">${x.solved?"Continue":"Open"}</button></div>`).join("")}</div>`}
async function resources(){
 const d=await api("/api/resources"),all=d.resources;
 const shown=resourceTopic==="all"?all:all.filter(r=>r.topic===resourceTopic);
 const options=[`<option value="all" ${resourceTopic==="all"?"selected":""}>All topics</option>`,...Object.keys(TOP).map(k=>`<option value="${k}" ${resourceTopic===k?"selected":""}>${esc(TOP[k])}</option>`)].join("");
 const kind={lesson:"Guided lesson",example:"Worked example"};
 $("app").innerHTML=`<div class="card"><h2>${ico("resources")} Learning Resources</h2><p class="muted">Browse concise, offline-friendly Python notes and open official documentation when available. Choose a topic to focus your learning.</p><label for="resourceTopic"><b>Filter by topic</b></label><select id="resourceTopic" onchange="resourceTopic=this.value;resources()" style="display:block;max-width:420px;width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)">${options}</select><p class="muted">Showing ${shown.length} resource${shown.length===1?"":"s"}.</p></div>`+
 (shown.length?`<div class="grid">${shown.map(r=>`<article class="card"><div class="row"><span class="chip">${esc(r.topic_name)}</span><span class="muted">${Number(r.minutes)} min</span></div><h3>${esc(r.title)}</h3><p class="muted">${esc(r.description)}</p><div class="meta"><span>${esc(kind[r.type]||r.type)}</span><span>${esc(r.difficulty)}</span></div><details><summary>Read quick notes</summary><pre>${esc(r.content)}</pre></details><div class="row" style="margin-top:12px;justify-content:flex-start">${r.url?`<a class="pri" style="text-decoration:none;display:inline-block" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open learning resource ↗</a>`:`<span class="muted">Offline resource</span>`}<button class="ghost" onclick="openModule('${r.topic}')">Practice this topic</button></div></article>`).join("")}</div>`:'<div class="card"><p>No resources are available for this topic yet.</p></div>');
}
async function moduleView(){if(!NICK.test(user))return needName();
 const m=await api(mine("/api/modules/"+curTopic)),kind={output:"Predict the output",bug:"Find the bug"};
 $("app").innerHTML=`<button class="ghost" onclick="go('learn')">Back to Learn</button><div class="card" style="margin-top:12px"><h2>${esc(m.title)}</h2><h3>The idea</h3><p>${esc(m.explain)}</p><div class="note"><b>Think of it like this:</b> ${esc(m.analogy)}</div><h3>Example</h3><pre class="code"><code>${hl(m.code)}</code></pre></div>`+m.items.map((it,n)=>`<div class="card"><div class="row"><h3>Practice ${n+1}: ${kind[it.kind]}</h3><span class="chip ${it.solved?"good":""}" id="st_${it.id}">${it.solved?"Solved":"Not solved yet"}</span></div><p>${esc(it.prompt)}</p>${it.code?`<pre class="code"><code>${hl(it.code)}</code></pre>`:""}<div role="group" aria-label="Answer options">${it.options.map((o,k)=>`<button class="opt" onclick="answerItem('${it.id}',${k})">${String.fromCharCode(65+k)}. ${esc(o)}</button>`).join("")}</div><div id="fb_${it.id}" role="status"></div></div>`).join("")+`<div class="card"><h3>Key takeaway</h3><p>${esc(m.takeaway)}</p><div class="row"><button class="ghost" onclick="go('learn')">Back to Learn</button><button class="pri" onclick="begin()">Take the diagnostic quiz</button></div></div>`}
async function answerItem(id,k){try{const d=await api("/api/practice",{item_id:id,selected:k}),fb=$("fb_"+id);
 fb.className="note";fb.innerHTML=d.correct?`<b>Correct.</b> ${esc(d.explanation)}`:`<b>Not quite, and that is part of learning.</b> The correct answer is ${esc(d.answer_text)}. ${esc(d.explanation)} Read the idea above again, then try another option if you like.`;
 if(d.correct){const s=$("st_"+id);s.textContent="Solved";s.className="chip good"}
 if(d.xp)toast(`+${d.xp} XP`);d.badges.forEach(b=>toast("Badge earned: "+b));if(d.module_done)toast("Module complete!");if(window.__story)window.__story.measure()}catch(e){alert(e.message)}}
async function assess(){if(!NICK.test(user))return needName();
 const at=(await api(mine("/api/progress"))).attempts,a=at[at.length-1],cnt=Object.keys(ans).length,resume=token&&Q.length&&cnt;
 $("app").innerHTML=`<div class="card"><h2>${ico("assess")} Diagnostic assessment</h2><p>${PT*Object.keys(TOP).length} questions, ${PT} from each of ${Object.keys(TOP).length} Python topics, about 10 minutes. Answers are checked on the server and revealed only after you submit. There is no pass or fail: results only decide what to study next.</p><div class="row" style="justify-content:flex-start">${resume?`<button class="pri" onclick="view='quiz';render()">Resume (${cnt} answered)</button>`:""}<button class="${resume?"ghost":"pri"}" onclick="begin()">${resume?"Start over":"Start new assessment"}</button></div></div>${a?`<div class="card"><h3>Latest result</h3><p><span class="big">${a.s}%</span> <span class="muted">${a.correct} of ${a.total} correct, ${esc(a.at.slice(0,10))}${a.demo?" (demo data)":""}</span></p><button class="ghost" onclick="go('results')">View results and explanations</button></div>`:""}`}
function summary(a){const ok=[],low=[];Object.keys(TOP).forEach(k=>{const t=a.t[k];if(!t)return;const p=pct(t[0],t[1]);(p>=TH.strong?ok:low).push({k,p})});low.sort((x,y)=>x.p-y.p);
 return `<div class="card"><h3>What this suggests</h3><p><b>Strengths so far:</b> ${ok.length?ok.map(x=>esc(TOP[x.k])+" ("+x.p+"%)").join(", "):"None yet. That is a normal starting point."}</p><p><b>Worth practising:</b> ${low.length?low.slice(0,3).map(x=>esc(TOP[x.k])+" ("+x.p+"%)").join(", "):"Nothing urgent."}</p>${low.length?`<div class="row" style="justify-content:flex-start">${low.slice(0,3).map(x=>`<button class="ghost sm" onclick="openModule('${x.k}')">Learn: ${esc(TOP[x.k].split(" ")[0])}</button>`).join("")}</div>`:""}<p class="muted">These are estimates from a few questions per topic, not final judgments.</p></div>`}

if(!NICK.test(user))openOnboarding();
render();
</script></body></html>
